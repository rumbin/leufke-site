name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time, latest wins.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8 (matches local pinned env)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install pinned dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          # NOTE: we deliberately install plain Nikola (NOT Nikola[extras]) because the
          # [extras] extra hard-pins PyYAML==3.12, an ancient release that only builds
          # from source and fails to compile on modern GitHub runners (CPython >=3.9
          # internal ABI). We install the individual packages the site actually needs,
          # pinned to the same versions as the working local env.
          pip install "Nikola==7.8.15" \
                      "docutils==0.19" \
                      "Pygments==2.14.0" \
                      "Markdown==3.3.4" \
                      "doit==0.33.1" \
                      "natsort==8.2.0" \
                      "Pillow==9.4.0" \
                      "piexif==1.1.3" \
                      "Logbook==1.5.3" \
                      "tornado==6.2" \
                      "requests==2.28.1" \
                      "sftpclone==1.2.2" \
                      "cryptography==3.4.7"

      - name: Build site for GitHub Pages subdomain
        env:
          SITE_URL_OVERRIDE: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: |
          # Override SITE_URL so sitemap/canonical point at the Pages target.
          python - <<'PY'
          import re
          p = 'conf.py'
          src = open(p).read()
          src = re.sub(
              r'SITE_URL\s*=\s*"[^"]*"',
              'SITE_URL = "' + __import__('os').environ['SITE_URL_OVERRIDE'] + '"',
              src,
          )
          open(p, 'w').write(src)
          PY
          nikola build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4