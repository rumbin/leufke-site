name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time, latest wins.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "Nikola==8.3.3" \
                      "docutils==0.23" \
                      "Pygments==2.20.0" \
                      "Markdown==3.10.3" \
                      "doit==0.37.0" \
                      "natsort==8.4.0" \
                      "Pillow==12.3.0" \
                      "piexif==1.1.3" \
                      "Logbook==1.10.1" \
                      "tornado==6.5.8" \
                      "requests==2.34.2" \
                      "lxml==6.1.1" \
                      "Mako==1.4.1" \
                      "sftpclone==1.2.2" \
                      "cryptography==50.0.0" \
                      "Babel==2.18.0"

      - name: Build site for GitHub Pages subdomain
        env:
          SITE_URL_OVERRIDE: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: |
          # Override SITE_URL so sitemap/canonical point at the Pages target.
          python - <<'PY'
          import re
          p = 'conf.py'
          src = open(p).read()
          src = re.sub(
              r'SITE_URL\s*=\s*"[^"]*"',
              'SITE_URL = "' + __import__('os').environ['SITE_URL_OVERRIDE'] + '"',
              src,
          )
          open(p, 'w').write(src)
          PY
          nikola build

      - name: Integration test — carousel slide heights must not jump
        run: |
          # The runner already ships Google Chrome at /usr/bin/google-chrome.
          # Install the test's pinned deps from the committed lock file, then run
          # the carousel check against the freshly built output/.
          ( cd tests && npm ci )
          node tests/carousel-heights.test.js

      - name: Integration test — external links must resolve
        run: |
          # Scans pages/ for external links and opens each in a headless browser.
          # Fails on genuinely dead links (404/410/network errors); 403 bot-blocks
          # are surfaced as warnings so real bot-protected pages don't flake CI.
          node tests/check-links.test.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
