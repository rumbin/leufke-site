# Build, test, and deploy.
#
# Branching model (GitHub Flow):
#   feature branch -> PR -> CI (build + integration tests) must pass
#                              -> merge to main -> auto-deploy to Pages.
#
# CI (build + both integration tests) runs on ANY pull_request targeting
# `main` AND on push to `main`, so a broken change is caught on the branch
# before it can ever reach the live site. Pages is deployed ONLY when a green
# check lands on `main` (see the `if` guard on the deploy job).
name: Build, Test & Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time, latest wins.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "Nikola==8.3.3" \
                      "docutils==0.23" \
                      "Pygments==2.20.0" \
                      "Markdown==3.10.3" \
                      "doit==0.37.0" \
                      "natsort==8.4.0" \
                      "Pillow==12.3.0" \
                      "piexif==1.1.3" \
                      "Logbook==1.10.1" \
                      "tornado==6.5.8" \
                      "requests==2.34.2" \
                      "lxml==6.1.1" \
                      "Mako==1.4.1" \
                      "sftpclone==1.2.2" \
                      "cryptography==50.0.0" \
                      "Babel==2.18.0"

      - name: Build site
        env:
          # On PRs the preview lives at the GitHub subdomain, so point
          # sitemap/canonical there.  On main (real deploy) keep the
          # custom-domain URL already in conf.py — no override needed.
          PR_SITE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        run: |
          # Only override SITE_URL on pull requests; main pushes use conf.py as-is.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python - <<'PY'
          import re, os
          p = 'conf.py'
          src = open(p).read()
          src = re.sub(
              r'SITE_URL\s*=\s*"[^"]*"',
              'SITE_URL = "' + os.environ['PR_SITE_URL'] + '"',
              src,
          )
          open(p, 'w').write(src)
          PY
          fi
          nikola build
          # GitHub Pages needs the CNAME file inside the deployed artifact.
          cp CNAME output/

      - name: Integration test — carousel slide heights must not jump
        run: |
          # The runner already ships Google Chrome at /usr/bin/google-chrome.
          # Install the test's pinned deps from the committed lock file, then run
          # the carousel check against the freshly built output/.
          ( cd tests && npm ci )
          node tests/carousel-heights.test.js

      - name: Integration test — external links must resolve
        run: |
          # Scans pages/ for external links and opens each in a headless browser.
          # Fails on genuinely dead links (404/410/network errors); 403/408/429
          # throttles are surfaced as warnings so protected pages don't flake CI.
          node tests/check-links.test.js

      # Only `main` performs a Pages deploy; PR runs stop here (check only).
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploy ONLY when a green check lands on main (not on PRs).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4